<style>
  :root{
    --asphalt:#121212; --deck:#1e1e1e; --chalk:#ece7dd; --chalk-dim:#a9a49a;
    --spray:#d6ff3f; --spray-dim:#9fbf2c; --line:#2c2c2c;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; }
  body{
    background:
      radial-gradient(circle at 1.5px 1.5px, rgba(236,231,221,0.05) 1px, transparent 1px) 0 0/14px 14px,
      var(--asphalt);
    color:var(--chalk);
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center;
    padding:44px 20px 70px;
    overflow-x:hidden;
  }
  .wrap{ width:100%; max-width:460px; text-align:center; }
  .eyebrow{ font-size:13px; color:var(--spray); font-weight:600; letter-spacing:.02em; }
  h1{ font-weight:900; font-size:clamp(38px,9vw,54px); line-height:.92; margin-top:6px; }
  h1 span{ color:var(--spray); }
  .sub{ margin:14px auto 0; color:var(--chalk-dim); font-size:15px; line-height:1.5; max-width:34ch; }

  /* ---------- STAGE ---------- */
  .stage{
    position:relative; margin:34px auto 0;
    width:240px; height:340px;
    perspective:1000px;
  }
  .glow{
    position:absolute; inset:-40px; border-radius:50%;
    background:radial-gradient(circle, var(--rc,#d6ff3f) 0%, transparent 65%);
    opacity:0; pointer-events:none; filter:blur(10px);
  }
  .tilt{ position:absolute; inset:0; transform-style:preserve-3d;
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .15s ease-out; }
  .card{
    position:absolute; inset:0; transform-style:preserve-3d;
    transition:transform .9s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
  }
  .card.flipped{ transform:rotateY(180deg); cursor:default; }
  .face{
    position:absolute; inset:0; border-radius:16px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    overflow:hidden;
  }

  /* back (face-down) */
  .back{
    background:
      repeating-linear-gradient(45deg, rgba(214,255,63,.07) 0 8px, transparent 8px 16px),
      linear-gradient(160deg,#242424,#141414);
    border:2px solid var(--spray-dim);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  .back::before{
    content:''; position:absolute; inset:10px; border:1px dashed rgba(214,255,63,.35); border-radius:10px;
  }
  .back .mark{
    font-size:84px; font-weight:900; color:var(--spray);
    text-shadow:0 0 24px rgba(214,255,63,.45);
  }
  .card:not(.flipped):not(.charging) .back{ animation:idle 2.4s ease-in-out infinite; }
  @keyframes idle{ 50%{ box-shadow:0 10px 36px rgba(214,255,63,.28); transform:translateY(-4px);} }

  /* front (revealed) */
  .front{
    transform:rotateY(180deg);
    background:linear-gradient(160deg,var(--rbg1,#2a2a2a),var(--rbg2,#141414));
    border:3px solid var(--rc,#bbb);
    box-shadow:0 0 28px var(--rg,rgba(255,255,255,.2)), 0 12px 34px rgba(0,0,0,.65);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:22px 16px 20px;
  }
  .front::before{ /* inner frame */
    content:''; position:absolute; inset:8px; border:1px solid var(--rc); opacity:.45; border-radius:10px; pointer-events:none; z-index:3;
  }
  .front::after{ /* holo shimmer */
    content:''; position:absolute; inset:-50%;
    background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.28) 48%, rgba(255,255,255,.05) 54%, transparent 62%);
    transform:translateX(-60%); pointer-events:none; mix-blend-mode:screen; z-index:4;
  }
  .card.flipped .front::after{ animation:sheen 1.4s .6s ease-out 1 forwards, sheenLoop 4s 3s linear infinite; }
  @keyframes sheen{ to{ transform:translateX(60%);} }
  @keyframes sheenLoop{ 0%{transform:translateX(-60%);} 60%,100%{transform:translateX(60%);} }

  .rar{ font-size:12px; font-weight:800; letter-spacing:.18em; color:var(--rc); }
  .stars{ font-size:15px; letter-spacing:4px; color:var(--rc); margin-top:4px; text-shadow:0 0 10px var(--rg); }
  .front > div:not(.art){ position:relative; z-index:2; }
  .art{
    position:absolute; inset:0; z-index:0;
    background:radial-gradient(circle at 50% 40%, var(--rg), transparent 70%), #111;
  }
  .art img{ width:100%; height:100%; object-fit:cover; display:block; }
  .art::after{ /* làm tối trên/dưới để chữ dễ đọc */
    content:''; position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,.72) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 52%, rgba(0,0,0,.9) 100%);
  }
  .tname{
    font-weight:900; font-size:28px; line-height:1.05; color:var(--chalk);
    text-shadow:0 2px 6px rgba(0,0,0,.9), 0 0 18px var(--rg);
  }
  .tsub{ margin-top:6px; font-size:11px; letter-spacing:.14em; color:var(--chalk-dim); font-weight:700; }

  /* rarity palettes */
  .r-common   { --rc:#b9b9b9; --rg:rgba(185,185,185,.30); --rbg1:#2b2b2b; --rbg2:#161616; }
  .r-rare     { --rc:#4aa8ff; --rg:rgba(74,168,255,.45);  --rbg1:#14283d; --rbg2:#0c1622; }
  .r-epic     { --rc:#b86bff; --rg:rgba(184,107,255,.50); --rbg1:#2a1642; --rbg2:#150b24; }
  .r-legendary{ --rc:#ffc933; --rg:rgba(255,201,51,.60);  --rbg1:#43300a; --rbg2:#1f1604; }
  .r-legendary .front{ animation:legend 2s ease-in-out infinite; }
  @keyframes legend{ 50%{ box-shadow:0 0 52px var(--rg), 0 12px 34px rgba(0,0,0,.65);} }

  /* charging (gacha shake + aura) */
  .card.charging{ animation:shake .9s ease-in-out forwards; }
  @keyframes shake{
    0%{transform:rotate(0)} 10%{transform:translateX(-6px) rotate(-3deg)} 20%{transform:translateX(6px) rotate(3deg)}
    30%{transform:translateX(-8px) rotate(-4deg)} 40%{transform:translateX(8px) rotate(4deg)}
    50%{transform:translateX(-10px) rotate(-5deg) scale(1.04)} 60%{transform:translateX(10px) rotate(5deg) scale(1.05)}
    75%{transform:translateX(-6px) rotate(-3deg) scale(1.07)} 100%{transform:translateX(0) rotate(0) scale(1.08)}
  }
  .glow.on{ animation:aura 1.3s ease-in forwards; }
  @keyframes aura{ 0%{opacity:0; transform:scale(.6);} 70%{opacity:.9; transform:scale(1.05);} 100%{opacity:.6; transform:scale(1);} }
  .glow.settle{ animation:none; opacity:.35; transition:opacity 1s; }

  /* flash + burst */
  .flash{
    position:fixed; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 45%, #fff, var(--rc,#fff) 40%, transparent 75%);
  }
  .flash.go{ animation:flash .7s ease-out forwards; }
  @keyframes flash{ 0%{opacity:.95;} 100%{opacity:0;} }
  .spark{
    position:absolute; left:50%; top:50%; width:8px; height:8px; border-radius:50%;
    background:var(--rc); box-shadow:0 0 10px var(--rc); pointer-events:none;
    animation:fly 1.1s cubic-bezier(.1,.8,.3,1) forwards;
  }
  @keyframes fly{
    from{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    to{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); opacity:0; }
  }

  /* ---------- controls ---------- */
  .roll-btn{
    margin-top:36px; width:100%; background:var(--spray); color:#121212; border:none; border-radius:3px;
    font-weight:700; font-size:16px; padding:16px 20px; cursor:pointer;
    transition:transform .15s ease, background .15s ease, opacity .15s;
  }
  .roll-btn:hover:not(:disabled){ background:#e4ff6e; }
  .roll-btn:active:not(:disabled){ transform:scale(.98); }
  .roll-btn:disabled{ opacity:.55; cursor:default; }
  .lock-note{ margin-top:16px; font-size:13px; font-weight:600; color:var(--spray-dim); }
  /* ---------- danh sách thẻ bài ---------- */
  .collection{ margin-top:46px; text-align:left; }
  .collection h2{ font-size:13px; letter-spacing:.14em; color:var(--spray); font-weight:800; }
  .coll-sub{ margin-top:5px; font-size:13px; color:var(--chalk-dim); }
  .grid{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:16px; }
  .mini{
    position:relative; width:100%; aspect-ratio:240/340;
    border-radius:10px; overflow:hidden; border:2px solid var(--line); background:#161616;
  }
  .mini.locked{
    background:repeating-linear-gradient(45deg, rgba(214,255,63,.05) 0 6px, transparent 6px 12px), #151515;
    display:flex; align-items:center; justify-content:center;
  }
  .mini .q{ font-size:38px; font-weight:900; color:rgba(214,255,63,.3); }
  .mini.got{ border-color:var(--rc); box-shadow:0 0 12px var(--rg); }
  .mini.today{ outline:2px solid var(--spray); outline-offset:2px; }
  .mini img{ width:100%; height:100%; object-fit:cover; display:block; }
  .mini .shade{ position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 28%); }
  .mini .st{ position:absolute; top:6px; left:7px; font-size:9px; letter-spacing:1px; color:var(--rc); }
  .mini .tag{ position:absolute; top:5px; right:5px; font-size:8px; font-weight:800; letter-spacing:.06em;
    background:var(--spray); color:#121212; padding:2px 4px; border-radius:3px; }
  .cell{ width:calc((100% - 20px) / 3); }
  .cap{ margin-top:7px; text-align:center; font-size:12.5px; font-weight:800; color:var(--chalk); line-height:1.2; }
  .cell.locked-cell .cap{ color:var(--chalk-dim); font-weight:600; }
  .mini.new{ animation:pop .7s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop{ 0%{ transform:scale(.55); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  footer{ margin-top:26px; color:var(--chalk-dim); font-size:12.5px; }

  @media (prefers-reduced-motion: reduce){
    .card.charging, .glow.on, .card:not(.flipped):not(.charging) .back, .r-legendary .front{ animation:none; }
    .card{ transition-duration:.01s; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">SESSION HÔM NAY</div>
    <h1>BỐC <span>1</span><br>TRICK</h1>
    <p class="sub">Mở thẻ bài để xem hôm nay phải quay trick nào. Mỗi ngày chỉ được bốc 1 lần.</p>
  </header>

  <div class="stage" id="stage">
    <div class="glow" id="glow"></div>
    <div class="tilt" id="tilt">
      <div class="card" id="card">
        <div class="face back"><div class="mark">?</div></div>
        <div class="face front">
          <div>
            <div class="rar" id="rarLabel"></div>
            <div class="stars" id="stars"></div>
          </div>
          <div class="art" id="art"><img id="artImg" alt="" draggable="false"></div>
          <div>
            <div class="tname" id="tname"></div>
            <div class="tsub">TRICK HÔM NAY</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="roll-btn" id="rollBtn">Mở thẻ bài</button>
  <p class="lock-note" id="lockNote" hidden>🔒 Đã dùng lượt bốc hôm nay. Quay lại vào ngày mai nhé!</p>

  <section class="collection">
    <h2>DANH SÁCH THẺ BÀI</h2>
    <p class="coll-sub" id="collSub"></p>
    <div class="grid" id="grid"></div>
  </section>

  <footer id="footerNote">Reset vào 00:00 mỗi ngày.</footer>
</div>
<div class="flash" id="flash"></div>

<script>
  // Mỗi trick thuộc một kiểu thẻ (màu/hiệu ứng). Tỉ lệ ra các trick đều bằng nhau.
  const RARITIES = [
    { key:'common',    label:'THƯỜNG',   stars:1, sparks:0,  tricks:['Ollie','Fakie Ollie'] },
    { key:'rare',      label:'HIẾM',     stars:2, sparks:14, tricks:['Fs 180','Fakie Fs 180','Half cab','Boneless'] },
    { key:'epic',      label:'SỬ THI',   stars:3, sparks:26, tricks:['V plant','Valial plant','Pop shuv','Cave man'] },
    { key:'legendary', label:'HUYỀN THOẠI', stars:4, sparks:44, tricks:['Cave shuv','Fingerflip'] }
  ];

  // Ảnh của từng trick (trick con dùng ảnh riêng của nó).
  const IMAGES = {
    'Ollie':'images/ollie.jpg', 'Fakie Ollie':'images/fakie-ollie.jpg', 'Fs 180':'images/fs-180.jpg', 'Fakie Fs 180':'images/fakie-fs-180.jpg',
    'Half cab':'images/half-cab.jpg', 'Boneless':'images/boneless.jpg', 'Pop shuv':'images/pop-shuv.jpg',
    'Cave man':'images/caveman.jpg', 'Cave shuv':'images/cave-shuv.jpg', 'Fingerflip':'images/fingerflip.jpg',
    'V plant':'images/v-plant.jpg', 'Valial plant':'images/valial-plant.jpg'
  };

  const stage = document.getElementById('stage');
  const tilt = document.getElementById('tilt');
  const card = document.getElementById('card');
  const glow = document.getElementById('glow');
  const flash = document.getElementById('flash');
  const rollBtn = document.getElementById('rollBtn');
  const lockNote = document.getElementById('lockNote');
  const rarLabel = document.getElementById('rarLabel');
  const starsEl = document.getElementById('stars');
  const tname = document.getElementById('tname');
  const artImg = document.getElementById('artImg');
  const footerNote = document.getElementById('footerNote');
  const grid = document.getElementById('grid');
  const collSub = document.getElementById('collSub');

  const STORAGE_KEY = 'skate_daily_challenge_v2';
  const HISTORY_KEY = 'skate_draw_history_v1';
  const ALL = RARITIES.flatMap(r => r.tricks.map(t => ({ trick: t, rarity: r.key })));
  let busy = false;

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function loadState() {
    try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function saveState(trick, rarity) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: todayKey(), trick, rarity })); } catch (e) {}
  }

  // Chuyển dữ liệu cũ: "Street Plant" đã tách thành V plant / Valial plant riêng.
  function fixName(t, sub) {
    if (t === 'Street Plant' || t === 'V-plant') {
      let legacy = null;
      try { legacy = (JSON.parse(localStorage.getItem('skate_sublog_v1')) || {})['Street Plant']; } catch (e) {}
      return sub || legacy || 'V plant';
    }
    return t;
  }

  function loadHistory() {
    try {
      const h = JSON.parse(localStorage.getItem(HISTORY_KEY));
      return Array.isArray(h) ? h.map(t => fixName(t)).filter(t => ALL.some(a => a.trick === t)) : [];
    } catch (e) { return []; }
  }
  function saveHistory(h) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch (e) {}
  }

  // Bốc ngẫu nhiên đều trong các trick CHƯA ra ở vòng hiện tại.
  // Bốc hết cả các trick thì mở vòng mới (và không cho trick vừa ra nằm ngay đầu vòng mới).
  function draw() {
    let history = loadHistory();
    let pool = ALL.filter(a => !history.includes(a.trick));
    if (!pool.length) {
      const last = history[history.length - 1];
      history = [];
      pool = ALL.filter(a => a.trick !== last);
    }
    const pick = pool[Math.floor(Math.random() * pool.length)];
    history.push(pick.trick);
    saveHistory(history);
    return pick;
  }

  function updateCycleNote() {
    footerNote.textContent = 'Không lặp lại trick cho đến khi bốc hết vòng (' + loadHistory().length + '/' + ALL.length + ') · Reset lượt bốc vào 00:00 mỗi ngày.';
  }

  function applyCard(trick, rarityKey) {
    const rar = RARITIES.find(r => r.key === rarityKey) || RARITIES[0];
    stage.className = 'stage r-' + rar.key;
    rarLabel.textContent = rar.label;
    starsEl.textContent = '★'.repeat(rar.stars) + '☆'.repeat(4 - rar.stars);
    tname.textContent = trick;
    artImg.style.visibility = 'visible';
    artImg.onerror = () => { artImg.style.visibility = 'hidden'; };
    artImg.src = IMAGES[trick] || '';
    return rar;
  }

  // Vẽ lưới thẻ: thẻ đã bốc trong vòng này hiện ảnh, thẻ chưa bốc úp lại.
  function renderList(newTrick) {
    const done = loadHistory(), saved = loadState();
    const today = saved && saved.date === todayKey() ? fixName(saved.trick, saved.sub) : null;
    grid.innerHTML = '';
    RARITIES.forEach(rar => rar.tricks.forEach(trick => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const el = document.createElement('div');
      el.className = 'mini r-' + rar.key;
      if (!done.includes(trick)) {
        el.classList.add('locked');
        const q = document.createElement('span'); q.className = 'q'; q.textContent = '?';
        el.appendChild(q);
      } else {
        el.classList.add('got');
        if (trick === today) el.classList.add('today');
        if (trick === newTrick) el.classList.add('new');
        const art = document.createElement('img');
        art.alt = trick; art.draggable = false; art.src = IMAGES[trick] || '';
        art.onerror = () => { art.style.visibility = 'hidden'; };
        const shade = document.createElement('div'); shade.className = 'shade';
        const st = document.createElement('div'); st.className = 'st'; st.textContent = '★'.repeat(rar.stars);
        el.append(art, shade, st);
        if (trick === today) { const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = 'HÔM NAY'; el.appendChild(tag); }
      }
      const cap = document.createElement('div');
      cap.className = 'cap'; cap.textContent = trick;
      if (!done.includes(trick)) cell.classList.add('locked-cell');
      cell.append(el, cap);
      grid.appendChild(cell);
    }));
    collSub.textContent = 'Đã bốc ' + done.length + '/' + ALL.length + ' thẻ trong vòng này. Bốc hết thì bắt đầu vòng mới.';
  }

  function lockForToday(fresh) {
    rollBtn.disabled = true;
    rollBtn.textContent = 'Đã bốc hôm nay';
    updateCycleNote();
    lockNote.hidden = false;
    renderList(fresh ? fixName(loadState().trick, loadState().sub) : null);
  }

  function burst(count) {
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const ang = Math.random() * Math.PI * 2;
      const dist = 110 + Math.random() * 190;
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      const size = 4 + Math.random() * 7;
      s.style.width = s.style.height = size + 'px';
      stage.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
  }

  function open() {
    if (busy || rollBtn.disabled) return;
    busy = true;
    rollBtn.disabled = true;
    rollBtn.textContent = 'Đang mở thẻ...';

    const { trick, rarity } = draw();
    const rar = applyCard(trick, rarity);
    saveState(trick, rarity);

    // 1) rung + hào quang màu độ hiếm
    card.classList.add('charging');
    glow.classList.add('on');

    // 2) lật thẻ + flash + pháo hạt
    setTimeout(() => {
      card.classList.remove('charging');
      card.classList.add('flipped');
      glow.classList.remove('on');
      glow.classList.add('settle');
      if (rar.sparks) {
        flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
        burst(rar.sparks);
      }
      if (navigator.vibrate) navigator.vibrate(rar.stars >= 3 ? [60, 40, 120] : 40);
      setTimeout(() => { busy = false; lockForToday(true); }, 900);
    }, 1000);
  }

  updateCycleNote();
  renderList();
  rollBtn.addEventListener('click', open);
  card.addEventListener('click', open);

  // Nghiêng thẻ theo con trỏ sau khi đã lật
  stage.addEventListener('pointermove', (e) => {
    if (!card.classList.contains('flipped')) return;
    const r = stage.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    tilt.style.setProperty('--ry', (px * 18) + 'deg');
    tilt.style.setProperty('--rx', (-py * 18) + 'deg');
  });
  stage.addEventListener('pointerleave', () => {
    tilt.style.setProperty('--rx', '0deg'); tilt.style.setProperty('--ry', '0deg');
  });

  // Khôi phục thẻ đã bốc hôm nay
  (function init() {
    const saved = loadState();
    if (saved && saved.date === todayKey() && saved.trick) {
      const t = fixName(saved.trick, saved.sub);
      if (t !== saved.trick) saveState(t, 'epic'); // đổi dữ liệu cũ sang trick mới
      const h = loadHistory();
      if (!h.includes(t)) { h.push(t); saveHistory(h); }
      applyCard(t, RARITIES.find(r => r.tricks.includes(t)).key);
      card.classList.add('flipped');
      glow.classList.add('settle');
      lockForToday();
    }
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
